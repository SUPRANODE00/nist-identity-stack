name: Firecrawl Telemetry Sweep & Diagnostic HUD

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  telemetry-sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Execute Telemetry and Negative-Space Verification
        run: |
          python3 spatial_bridge_parser.py
          python3 spatial_visualizer.py
          git config --global user.name "SUPRANODE00"
          git config --global user.email "supranode00@users.noreply.github.com"
          git add lunar-telemetry-engine/config/active_bridge_mesh.json
          git commit -m "Automated telemetry radius sweep and negative node binding update [skip ci]" || echo "No changes to commit"
          git push || echo "No remote configured"
