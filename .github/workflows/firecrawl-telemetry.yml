name: Firecrawl Telemetry & RF Mesh Scraper

on:
  workflow_dispatch:   # manual trigger
  schedule:
    - cron: "0 2 * * *"   # run nightly at 2 AM UTC

jobs:
  firecrawl-ingestion:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        endpoint: 
          - https://hearthealthcommunity.com/hhc/multi
          - https://cocalc.com/share/public_paths/3a841bd6c02ca62d1e0eea3b527d75c5c886c642
          - https://example.com/rf-mesh-specs
          - https://example.com/axis-tcet-docs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firecrawl CLI locally
        run: npm install firecrawl-cli@latest

      - name: Scrape matrix endpoint
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          fname=$(echo "${{ matrix.endpoint }}" | sed 's/[^a-zA-Z0-9]/_/g').json
          npx firecrawl scrape "${{ matrix.endpoint }}" --output "$fname"

      - name: Post-process scraped JSON
        run: |
          for f in *.json; do
            [ -f "$f" ] || continue
            # jq: remove transient fields if present
            jq 'del(.metadata,.timestamp // empty)' "$f" > tmp.json && mv tmp.json "$f" || true
            # sed: strip empty lines
            sed -i '/^$/d' "$f"
            # awk: retain structure and identifier lines
            awk '{print}' "$f" > cleaned.json && mv cleaned.json "$f"
          done

      - name: Feed results into capsulecraft runtime & trigger reload
        run: |
          mkdir -p capsulecraft/runtime/ingestion
          cp *.json capsulecraft/runtime/ingestion/ 2>/dev/null || true
          
          # Trigger capsulecraft runtime state reload hook if executable exists
          if [ -f "control.sh" ]; then
            bash control.sh --reload-ingestion || echo "Runtime reload hook skipped."
          fi
          echo "Capsulecraft runtime ingestion synchronized."

      - name: Commit and push ingestion results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.json capsulecraft/runtime/ingestion/
          git commit -m "chore(ci): parallelized nightly Firecrawl matrix scrape & capsulecraft sync" || echo "No changes to commit"
          git push origin main
