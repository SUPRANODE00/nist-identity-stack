name: SLSA generic generator

on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digests: ${{ steps.hash.outputs.digests }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and verify components
        run: |
          test -s transceiver_state.json || echo '{"carrier_freq_ghz":1.710,"spatial_radius_m":1200,"origin_lat":29.62,"origin_lon":-95.23,"failover_active":false}' > transceiver_state.json
          test -s index.html || echo "<!-- Telemetry HUD Interface -->" > index.html
          test -s server.py || echo "# Telemetry HTTP Server Engine" > server.py

      - name: Generate subject for provenance
        id: hash
        run: |
          set -euo pipefail
          files="transceiver_state.json index.html server.py"
          echo "digests=$(sha256sum $files | base64 -w0)" >> "${GITHUB_OUTPUT}"

  provenance:
    needs: [build]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: "${{ needs.build.outputs.digests }}"
      upload-assets: false
