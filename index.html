<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CAPSULECRAFT // TRANSCEIVER HUD</title>
    <style>
        body { background: #0a0a0a; color: #00ff66; font-family: monospace; padding: 20px; }
        .hud-card { border: 1px solid #00ff66; padding: 20px; width: 340px; background: #111; box-shadow: 0 0 10px rgba(0,255,102,0.2); }
        .val { color: #ffffff; font-weight: bold; }
        .warn { color: #ff0055; font-weight: bold; }
        .btn {
            display: block; width: 100%; margin-top: 15px; padding: 10px;
            background: #1a1a1a; color: #00ff66; border: 1px solid #00ff66;
            font-family: monospace; font-weight: bold; cursor: pointer; text-align: center;
        }
        .btn:hover { background: #00ff66; color: #0a0a0a; }
        .btn-active { border-color: #ff0055; color: #ff0055; }
        .btn-active:hover { background: #ff0055; color: #ffffff; }
    </style>
</head>
<body>

    <div class="hud-card">
        <h2>CAPSULECRAFT // NODE 0x44</h2>
        <hr>
        <p>CARRIER FREQ: <span id="freq" class="val">--</span></p>
        <p>SPATIAL RADIUS: <span id="radius" class="val">--</span></p>
        <p>FAILOVER MODE: <span id="failover" class="val">--</span></p>
        <p>LAT / LON: <span id="coords" class="val">--</span></p>
        
        <button id="toggleBtn" class="btn" onclick="toggleFailover()">TOGGLE FAILOVER STATE</button>
    </div>

    <script>
        async function updateHUD() {
            try {
                const res = await fetch('/transceiver_state.json');
                const state = await res.json();
                
                document.getElementById('freq').innerText = state.carrier_freq_ghz + " GHz";
                document.getElementById('radius').innerText = state.spatial_radius_m + " m";
                
                const failoverElem = document.getElementById('failover');
                const toggleBtn = document.getElementById('toggleBtn');

                if (state.failover_active) {
                    failoverElem.innerText = "ACTIVE (WAL MIRROR)";
                    failoverElem.className = "warn";
                    toggleBtn.className = "btn btn-active";
                    toggleBtn.innerText = "DEACTIVATE FAILOVER";
                } else {
                    failoverElem.innerText = "STANDBY";
                    failoverElem.className = "val";
                    toggleBtn.className = "btn";
                    toggleBtn.innerText = "ACTIVATE FAILOVER";
                }

                document.getElementById('coords').innerText = `[${state.origin_lat}, ${state.origin_lon}]`;
            } catch (err) {
                console.error("HUD Stream Disrupted:", err);
            }
        }

        async function toggleFailover() {
            try {
                const res = await fetch('/toggle-failover', { method: 'POST' });
                if (res.ok) {
                    await updateHUD();
                }
            } catch (err) {
                console.error("Failed to post failover state shift:", err);
            }
        }

        setInterval(updateHUD, 1000);
        updateHUD();
    </script>
</body>
</html>
